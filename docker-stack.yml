services:
  postgres:
    image: postgres:17-alpine
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - b3_data_hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

  migrate:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    configs:
      - source: historical_migration
        target: /migrations/001_create_historical_quotes.up.sql
    command:
      - sh
      - -c
      - |
        echo "Aguardando PostgreSQL..."

        until pg_isready -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 2
        done

        echo "PostgreSQL disponível. Executando migration..."

        psql \
          -h postgres \
          -U "$$POSTGRES_USER" \
          -d "$$POSTGRES_DB" \
          -v ON_ERROR_STOP=1 \
          -f /migrations/001_create_historical_quotes.up.sql

        echo "Migration concluída com sucesso."
    networks:
      - b3_data_hub
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

  importer-scheduler:
    image: ghcr.io/jamersom/b3-data-hub:${IMAGE_TAG:-latest}
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks:
      - b3_data_hub
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

volumes:
  postgres_data:

networks:
  b3_data_hub:
    driver: overlay
    attachable: true

configs:
  historical_migration:
    file: ./migrations/001_create_historical_quotes.up.sql
